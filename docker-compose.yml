services:
  # Laravel Backend
  laravel-backend:
    cpus: 0.5
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: define-pilates-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./Backend:/var/www
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=define_pilates
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=define_pilates_mongo
    depends_on:
      - mysql
      - mongodb
    networks:
      - app-network

  # Next.js Frontend
  nextjs-frontend:
    cpus: 0.5
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: define-pilates-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - laravel-backend
    networks:
      - app-network

  # MySQL Database
  mysql:
    cpus: 0.5
    image: mysql:8.0
    container_name: define-pilates-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: define_pilates
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  # MongoDB Database
  mongodb:
    cpus: 0.5
    image: mongo:7.0
    container_name: define-pilates-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: define_pilates_mongo
    volumes:
      - mongodb_data:/data/db
      - ./database/mongodb/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - app-network

  # Mongo Express (opcional - para gerenciar MongoDB)
  mongo-express:
    cpus: 0.5
    image: mongo-express
    container_name: define-pilates-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - app-network

volumes:
  mysql_data:
  mongodb_data:

networks:
  app-network:
    driver: bridge