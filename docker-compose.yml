services:
  # Laravel Backend
  laravel-backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: define-pilates-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./Backend:/var/www
      - /etc/localtime:/etc/localtime:ro  # ✅ Sincronizar com host
      - /etc/timezone:/etc/timezone:ro    # ✅ Sincronizar com host
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MONGODB_HOST: ${MONGODB_HOST}
      MONGODB_PORT: ${MONGODB_PORT}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: define-pilates-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: define-pilates-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    volumes:
      - mongodb_data:/data/db
      - ./database/mongodb/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      # Interval aumentado para reduzir conexões e ruído de logs. Ajuste se precisar de detecção mais rápida.
      interval: 30s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Mongo Express (opcional - para gerenciar MongoDB)
  mongo-express:
    cpus: 0.5
    image: mongo-express
    container_name: define-pilates-mongo-express
    restart: unless-stopped
    # # Só será iniciado quando perfil 'tools' for usado:
    # # docker compose --profile tools up -d mongo-express
    # profiles:
    #   - tools
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${ME_CONFIG_MONGODB_ADMINUSERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${ME_CONFIG_MONGODB_ADMINPASSWORD}
      ME_CONFIG_MONGODB_URL: ${ME_CONFIG_MONGODB_URL}
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - app-network

  # Frontend React (Vite) - Projeto pi-react (opcional)
  pi-react:
    # Para subir somente quando necessário, descomente o bloco profiles abaixo
    # profiles:
    #   - tools
    build:
      context: ./pi-react
      dockerfile: Dockerfile
    container_name: define-pilates-pi-react
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
    command: ["npm","run","dev","--","--host","0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - ./pi-react:/app:cached
      - pi_react_node_modules:/app/node_modules
    depends_on:
      - laravel-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network
  ngrok-backend:
    build:
      context: ./Ngrok
      dockerfile: Dockerfile
      args:
        - NGROK_CONFIG=ngrok-backend.yml
    container_name: define-pilates-ngrok-backend
    profiles:
      - ngrok
    ports:
      - "4041:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN_BACKEND}
      - NGROK_URL=${NGROK_BACKEND_URL}
    volumes:
      - ./Ngrok/ngrok-backend.yml:/etc/ngrok.yml:ro
    depends_on:
      laravel-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  ngrok-frontend:
    build:
      context: ./Ngrok
      dockerfile: Dockerfile
      args:
        - NGROK_CONFIG=ngrok-frontend.yml
    container_name: define-pilates-ngrok-frontend
    profiles:
      - ngrok
    ports:
      - "4042:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN_FRONTEND}
      - NGROK_URL=${NGROK_FRONTEND_URL}
    volumes:
      - ./Ngrok/ngrok-frontend.yml:/etc/ngrok.yml:ro
    depends_on:
      - pi-react
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mysql_data:
  mongodb_data:
  pi_react_node_modules:

networks:
  app-network:
    driver: bridge